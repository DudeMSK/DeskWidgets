<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Часы</title>
  <style>
    body { padding: 8px; box-sizing: border-box; font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: #fff; }
    .card {
      height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: 20px; background: rgba(22, 22, 28, 0.86);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    }
    .time { font-size: 44px; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .date { margin-top: 2px; font-size: 13px; color: rgba(255, 255, 255, 0.62); text-transform: capitalize; }
  </style>
</head>
<body>
  <div class="card">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date"></div>
  </div>
  <script>
    const time = document.getElementById('time');
    const date = document.getElementById('date');
    function update() {
      const now = new Date();
      time.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      date.textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
